<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KopiBarokah - Coffee Shop</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f3ed;
            color: #3e2723;
        }

        /* NAVBAR */
        nav {
            background: #3e2723;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            color: #fff;
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #d7a86e;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav ul li a:hover {
            color: #d7a86e;
        }

        /* HERO */
        .hero {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px 8%;
            background: linear-gradient(
                rgba(62,39,35,0.8),
                rgba(62,39,35,0.8)
            ),
            url("https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1600&q=80");
            background-size: cover;
            background-position: center;
            color: white;
        }

        .hero-text {
            max-width: 600px;
        }

        .hero h1 {
            font-size: 55px;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #d7a86e;
        }

        .hero p {
            font-size: 19px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 14px 25px;
            background: #c48a55;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background: #a96838;
            transform: scale(1.05);
        }

        /* SECTION */
        section {
            padding: 70px 8%;
        }

        .title {
            text-align: center;
            margin-bottom: 40px;
        }

        .title h2 {
            font-size: 35px;
            color: #3e2723;
        }

        .title p {
            margin-top: 10px;
            color: #795548;
        }

        /* MENU */
        .menu-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
        }

        .card h3 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .card p {
            color: #795548;
            margin-bottom: 15px;
        }

        .price {
            color: #a96838;
            font-size: 20px;
            font-weight: bold;
            display: block;
            margin-bottom: 15px;
        }

        /* TENTANG */
        .about {
            display: flex;
            gap: 50px;
            align-items: center;
        }

        .about img {
            width: 45%;
            border-radius: 20px;
        }

        .about-text {
            flex: 1;
        }

        .about-text h2 {
            font-size: 35px;
            margin-bottom: 20px;
        }

        .about-text p {
            line-height: 1.8;
            color: #654d45;
        }

        /* FITUR */
        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            text-align: center;
        }

        .feature {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .feature .icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .feature h3 {
            margin-bottom: 10px;
        }

        /* KONTAK */
        .contact {
            background: #3e2723;
            color: white;
            text-align: center;
        }

        .contact h2 {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .contact p {
            margin: 10px;
        }

        /* FOOTER */
        footer {
            background: #241512;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* RESPONSIVE */
        @media (max-width: 800px) {
            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav ul {
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero {
                text-align: center;
                justify-content: center;
            }

            .hero h1 {
                font-size: 40px;
            }

            .menu-container,
            .features {
                grid-template-columns: 1fr;
            }

            .about {
                flex-direction: column;
